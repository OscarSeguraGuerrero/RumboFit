services:
  # FRONTEND: Expo / React Native
  app-frontend:
    build:
      context: ./frontend_ReactNative
      dockerfile: Dockerfile
    container_name: rumbofit_container
    ports:
      - "8082:8082"
    stdin_open: true
    tty: true
    init: true
    # AÑADIDO: Forzamos el comando con npx para evitar el error "expo: not found"
    command: >
      sh -c "npm install && export REACT_NATIVE_PACKAGER_HOSTNAME=$(node -e \"const fs=require('fs'); const match=fs.readFileSync('config.js','utf8').match(/IP_PC\\s*=\\s*['\\\"]([^'\\\"]+)/); if (!match) process.exit(1); console.log(match[1]);\") && npx expo start --lan --port 8082"

  # BASE DE DATOS: PostgreSQL
  db:
    image: postgres:15
    container_name: rumbofit_db
    restart: always
    environment:
      POSTGRES_USER: rumbofit
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: rumbofit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # AÑADIDO: Healthcheck para comprobar que Postgres está listo para recibir conexiones
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U rumbofit -d rumbofit" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # BACKEND: Node.js + Prisma
  backend:
    build:
      context: ./backend
    container_name: rumbofit_backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://rumbofit:password123@db:5432/rumbofit?schema=public"
      STRIPE_SECRET_KEY: "sk_test_51TWL1tHYDCqDcwTab9fyJFyi1PhHNpfK35P1F0RtkQD5NzYKER0hOIadlSR9EmWFAzhgxPsn1nkIPeFJHbBcIYlm00cpkqXRwr"
      STRIPE_PUBLISHABLE_KEY: "pk_test_51TWL1tHYDCqDcwTaFil3GxKsyWj6UJNmnk0gbXPCjWtJQy1up4RgEYbOzZYBMM42dUvcOS59gA81vxfVYlMbtsK7007pRjq7cs"
      PREMIUM_PRICE_CENTS: "999"
    volumes:
      - ./backend:/app
      - /app/node_modules
    # MODIFICADO: Ahora espera a que el healthcheck de la BD sea exitoso ("healthy")
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push --accept-data-loss && npx prisma db seed && npm run dev"

volumes:
  pgdata: